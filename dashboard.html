<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub PR Dashboard</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  --border-radius: 6px;
  --transition-duration: 0.2s;
}

/* Light theme */
[data-theme="light"] {
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1F2328;
  --color-fg-muted: #656d76;
  --color-fg-subtle: #6e7781;
  --color-fg-on-emphasis: #ffffff;
  --color-neutral-muted: rgba(175, 184, 193, 0.2);
  --color-neutral-subtle: rgba(234, 238, 242, 0.5);
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1a7f37;
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-done-fg: #8250df;
  --color-done-emphasis: #8250df;
  --color-btn-bg: #f6f8fa;
  --color-btn-border: rgba(31, 35, 40, 0.15);
  --color-btn-hover-bg: #f3f4f6;
  --color-header-bg: #25292e;
  --color-header-text: #ffffff;
  --color-header-logo: #ffffff;
  --color-shadow: rgba(31, 35, 40, 0.04);
  --color-shadow-medium: rgba(31, 35, 40, 0.08);
  --color-avatar-border: rgba(31, 35, 40, 0.08);
  --color-counter-bg: rgba(175, 184, 193, 0.2);
  --color-pr-open: #1a7f37;
  --color-pr-draft: #656d76;
  --color-pr-merged: #8250df;
}

/* Dark theme */
[data-theme="dark"] {
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #c9d1d9;
  --color-fg-muted: #8b949e;
  --color-fg-subtle: #6e7681;
  --color-fg-on-emphasis: #ffffff;
  --color-neutral-muted: rgba(110, 118, 129, 0.4);
  --color-neutral-subtle: rgba(110, 118, 129, 0.1);
  --color-accent-fg: #58a6ff;
  --color-accent-emphasis: #1f6feb;
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-done-fg: #a371f7;
  --color-done-emphasis: #8957e5;
  --color-btn-bg: #21262d;
  --color-btn-border: rgba(240, 246, 252, 0.1);
  --color-btn-hover-bg: #30363d;
  --color-header-bg: #161b22;
  --color-header-text: #f0f6fc;
  --color-header-logo: #f0f6fc;
  --color-shadow: transparent;
  --color-shadow-medium: rgba(0, 0, 0, 0.3);
  --color-avatar-border: rgba(240, 246, 252, 0.1);
  --color-counter-bg: rgba(110, 118, 129, 0.4);
  --color-pr-open: #3fb950;
  --color-pr-draft: #8b949e;
  --color-pr-merged: #a371f7;
}

html {
  font-size: 14px;
}

body {
  font-family: var(--font-sans);
  background: var(--color-canvas-default);
  color: var(--color-fg-default);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition-duration) ease, color var(--transition-duration) ease;
}

a {
  color: var(--color-accent-fg);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* ===== HEADER ===== */
.AppHeader {
  background: var(--color-header-bg);
  padding: 0 16px;
  height: 48px;
  display: flex;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--color-border-muted);
}

.AppHeader-logo {
  color: var(--color-header-logo);
  display: flex;
  align-items: center;
  margin-right: 16px;
}

.AppHeader-logo svg {
  fill: currentColor;
}

.AppHeader-context {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--color-header-text);
  font-size: 14px;
  font-weight: 600;
}

.AppHeader-context .separator {
  color: rgba(255, 255, 255, 0.4);
  font-weight: 300;
}

.AppHeader-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.AppHeader-refresh {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--color-header-text);
  font-size: 13px;
  opacity: 0.7;
}

.AppHeader-refresh .refresh-btn {
  background: none;
  border: none;
  color: var(--color-header-text);
  cursor: pointer;
  padding: 2px;
  opacity: 0.7;
  transition: opacity 0.15s;
}

.AppHeader-refresh .refresh-btn:hover {
  opacity: 1;
}

.AppHeader-user {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--color-header-text);
  font-size: 13px;
}

.AppHeader-user img {
  width: 20px;
  height: 20px;
  border-radius: 50%;
}

/* ===== THEME TOGGLE ===== */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 2px;
  gap: 0;
}

.theme-toggle button {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.5);
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.theme-toggle button:hover {
  color: rgba(255, 255, 255, 0.8);
}

.theme-toggle button.active {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
}

.theme-toggle button svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

/* ===== REFRESH BUTTON ===== */
.refresh-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-btn-bg);
  border: 1px solid var(--color-btn-border);
  border-radius: var(--border-radius);
  color: var(--color-fg-muted);
  cursor: pointer;
  padding: 3px 6px;
  margin-left: 6px;
  vertical-align: middle;
  transition: all 0.15s ease;
  position: relative;
}
.refresh-btn::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #24292f;
  color: #fff;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s ease;
  z-index: 100;
}
.refresh-btn:hover::after {
  opacity: 1;
}

.refresh-btn:hover {
  color: var(--color-fg-default);
  background: var(--color-btn-hover-bg);
  border-color: var(--color-border-default);
}

.refresh-btn:active svg {
  animation: gh-spin 0.5s ease;
}

@keyframes gh-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== LAYOUT ===== */
.Layout {
  max-width: 100%;
  margin: 0;
  padding: 24px 32px;
}

/* ===== SUMMARY STATS (GitHub UnderlineNav style) ===== */
.summary-stats {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--color-border-muted);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  white-space: nowrap;
  padding: 8px 16px 12px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.stat-item .stat-counter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 10px;
  background: var(--color-counter-bg);
  color: var(--color-fg-default);
}

.stat-item .stat-counter.danger { background: rgba(207,34,46,0.1); color: var(--color-danger-fg); }
.stat-item .stat-counter.accent { background: rgba(9,105,218,0.1); color: var(--color-accent-fg); }
.stat-item .stat-counter.success { background: rgba(26,127,55,0.1); color: var(--color-success-fg); }
.stat-item .stat-counter.done { background: rgba(130,80,223,0.1); color: var(--color-done-fg); }
.stat-item .stat-counter.attention { background: rgba(154,103,0,0.1); color: var(--color-attention-fg); }

.stat-item .stat-icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
}

.stat-item .stat-icon svg {
  width: 16px;
  height: 16px;
}

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 0;
}

.filter-group-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
  margin-right: 12px;
  white-space: nowrap;
}

.filter-separator {
  width: 1px;
  height: 24px;
  background: var(--color-border-default);
  margin: 0 4px;
}

/* Time filter — GitHub UnderlineNav style */
.time-nav {
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--color-border-muted);
}

.time-nav button {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  color: var(--color-fg-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 6px 16px 10px;
  margin-bottom: -1px;
  cursor: pointer;
  transition: all 0.1s ease;
  white-space: nowrap;
}

.time-nav button:hover {
  color: var(--color-fg-default);
  border-bottom-color: var(--color-neutral-muted);
}

.time-nav button.selected {
  font-weight: 600;
  color: var(--color-fg-default);
  border-bottom-color: var(--color-accent-fg);
}

/* Team filters — GitHub label/topic style */
.team-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.team-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--color-accent-fg);
  background: transparent;
  border: 1px solid var(--color-border-default);
  border-radius: 2em;
  padding: 2px 10px;
  cursor: pointer;
  transition: all 0.1s ease;
  white-space: nowrap;
}

.team-pill:hover {
  background: var(--color-neutral-subtle);
  border-color: var(--color-border-default);
}

.team-pill.active {
  background: var(--color-accent-emphasis);
  color: var(--color-fg-on-emphasis);
  border-color: transparent;
}

.team-pill .team-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 10px;
  background: var(--color-counter-bg);
  color: var(--color-fg-default);
}

.team-pill.active .team-count {
  background: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}

/* ===== COLUMNS LAYOUT ===== */
.columns-layout {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  align-items: start;
}

/* ===== SECTION GROUP (Box component) ===== */
.section-group {
  transition: border-color var(--transition-duration) ease;
}

.section-group-content {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-group-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: default;
  background: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--border-radius);
  margin-bottom: 12px;
}

.section-group-header svg {
  fill: var(--color-fg-muted);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.section-group-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.section-group-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 10px;
  background: var(--color-counter-bg);
  color: var(--color-fg-default);
}

/* ===== SUBSECTION (collapsible) ===== */
.subsection {
  border: 1px solid var(--color-border-default);
  border-radius: var(--border-radius);
  overflow: hidden;
  transition: border-color var(--transition-duration) ease;
}

.subsection-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  background: var(--color-neutral-muted);
  border-bottom: 1px solid var(--color-border-default);
  transition: background 0.1s ease;
}

.subsection-header:hover {
  background: var(--color-border-default);
}

.subsection-toggle {
  width: 16px;
  height: 16px;
  fill: var(--color-fg-muted);
  flex-shrink: 0;
  transition: transform 0.15s ease;
}

.subsection.collapsed .subsection-toggle {
  transform: rotate(-90deg);
}

.subsection-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-muted);
}

.subsection-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 10px;
}

.count-blue { background: rgba(9, 105, 218, 0.1); color: var(--color-accent-fg); }
.count-green { background: rgba(26, 127, 55, 0.1); color: var(--color-success-fg); }
.count-orange { background: rgba(154, 103, 0, 0.1); color: var(--color-attention-fg); }
.count-red { background: rgba(207, 34, 46, 0.1); color: var(--color-danger-fg); }
.count-purple { background: rgba(130, 80, 223, 0.1); color: var(--color-done-fg); }
.count-gray { background: var(--color-counter-bg); color: var(--color-fg-muted); }

.subsection-content {
  overflow-y: auto;
  max-height: 198px;
  transition: max-height 0.2s ease;
}

.subsection.collapsed .subsection-content {
  max-height: 0 !important;
  overflow: hidden;
}

.subsection-content::-webkit-scrollbar {
  width: 6px;
}

.subsection-content::-webkit-scrollbar-track {
  background: transparent;
}

.subsection-content::-webkit-scrollbar-thumb {
  background: var(--color-border-default);
  border-radius: 3px;
}

.subsection-content::-webkit-scrollbar-thumb:hover {
  background: var(--color-fg-subtle);
}

.subsection-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 13px;
}

/* ===== PR ROW ===== */
.pr-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  transition: background 0.1s ease;
}

.pr-row:hover {
  background: var(--color-neutral-subtle);
}

.pr-status-icon {
  flex-shrink: 0;
  margin-top: 3px;
  width: 16px;
  height: 16px;
}

.pr-status-icon svg {
  width: 16px;
  height: 16px;
}

.pr-main {
  flex: 1;
  min-width: 0;
}

.pr-title-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  flex-wrap: wrap;
}

.pr-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
  word-break: break-word;
  line-height: 1.4;
}

.pr-title:hover {
  color: var(--color-accent-fg);
  text-decoration: none;
  cursor: pointer;
}

/* Labels */
.Label {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  padding: 0 7px;
  border-radius: 20px;
  border: 1px solid transparent;
  white-space: nowrap;
  vertical-align: middle;
}

/* Badges */
.Badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  vertical-align: middle;
}

.Badge-stale {
  background: rgba(154, 103, 0, 0.15);
  color: var(--color-attention-fg);
}

.Badge-draft {
  background: var(--color-neutral-muted);
  color: var(--color-fg-muted);
}

.Badge-bot {
  background: rgba(130, 80, 223, 0.12);
  color: var(--color-done-fg);
}

/* Team tags */
.team-tag {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--color-neutral-subtle);
  color: var(--color-fg-muted);
  border: 1px solid var(--color-border-muted);
  white-space: nowrap;
  font-family: var(--font-mono);
}

.pr-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: 4px;
  flex-wrap: wrap;
}

.pr-meta a {
  color: var(--color-fg-muted);
  font-weight: 500;
}

.pr-meta a:hover {
  color: var(--color-accent-fg);
}

.pr-meta .pr-repo {
  font-family: var(--font-mono);
  font-size: 12px;
}

.pr-meta .pr-author {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--color-fg-default);
  font-weight: 600;
  text-decoration: none;
}

.pr-author-avatar {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid var(--color-avatar-border);
}

.pr-meta .pr-author:hover {
  color: var(--color-accent-fg);
}

.pr-meta .dot {
  color: var(--color-fg-subtle);
}

/* ===== GENERATED FOOTER ===== */
.footer {
  text-align: center;
  padding: 32px 0 24px;
  color: var(--color-fg-subtle);
  font-size: 12px;
  border-top: 1px solid var(--color-border-muted);
  margin-top: 32px;
}

.footer a {
  color: var(--color-fg-subtle);
}

.footer a:hover {
  color: var(--color-accent-fg);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) {
  .columns-layout { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  .Layout { padding: 16px; }
  .summary-stats { flex-direction: column; }
  .filter-bar { flex-direction: column; align-items: flex-start; }
  .filter-separator { display: none; }
  .AppHeader-context .full-text { display: none; }
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-group {
  animation: fadeIn 0.3s ease;
}

</style>
</head>
<body>
<div class="AppHeader">
  <a class="AppHeader-logo" href="https://github.com">
    <svg height="32" viewBox="0 0 16 16" width="32">

    </svg>
  </a>
  <div class="AppHeader-context">
    <span>Pull Requests</span>
    <span class="separator">/</span>
    <span>Dashboard</span>
  </div>
  <div class="AppHeader-actions">
    <div class="AppHeader-refresh" id="headerRefresh"></div>

var BOT_PATTERNS = [

  /^depfu/i, /-bot$/i, /^bot-/i
];

var BOT_USERNAMES = DATA.extraBotUsernames || [];

function isBot(pr) {
  var author = getAuthor(pr).toLowerCase();
  for (var i = 0; i < BOT_USERNAMES.length; i++) {
    if (author === BOT_USERNAMES[i].toLowerCase()) return true;
  }
  for (var i = 0; i < BOT_PATTERNS.length; i++) {
    if (BOT_PATTERNS[i].test(author)) return true;
  }
  return false;
}

// ============================================================
// Helpers

function exclude(source) {
  var excludeSets = Array.prototype.slice.call(arguments, 1);
  var urls = {};
  excludeSets.forEach(function(s) { s.forEach(function(pr) { urls[pr.url] = true; }); });
  return source.filter(function(pr) { return !urls[pr.url]; });
}

function getRepoName(pr) {
  if (pr.repository && pr.repository.nameWithOwner) return pr.repository.nameWithOwner;
  if (pr.repository && pr.repository.name) return pr.repository.name;
  return '';
}
function getAuthor(pr) { return (pr.author && pr.author.login) ? pr.author.login : 'unknown'; }
function getAvatarUrl(pr) { return 'https://github.com/' + getAuthor(pr) + '.png?size=64'; }

function timeAgo(dateStr) {
  var seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
  if (seconds < 60) return 'now';
  var minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + 'm';
  var hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + 'h';
  var days = Math.floor(hours / 24);
  if (days < 30) return days + 'd';
  var months = Math.floor(days / 30);
  return months + 'mo';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function labelColor(label) { return label.color ? '#' + label.color : '#6c757d'; }
function textColorForBg(hex) {
  hex = hex.replace('#', '');
  var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#1F2328' : '#ffffff';
}

function filterByTime(prs) {
  var weeks;
  if (activeTimeFilter === '1w') weeks = 1;
  else if (activeTimeFilter === '3w') weeks = 3;
  else if (activeTimeFilter === '1m') weeks = 4;
  else return prs;
  var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (weeks * 7));
  return prs.filter(function(pr) { return new Date(pr.createdAt) >= cutoff; });
}

  var approvedTeam = DATA.approvedTeam;
  var reviewDirect = exclude(DATA.reviewDirect, reviewTeam);
  var approvedMe = exclude(DATA.approvedMe, approvedTeam);

  var teamUrlSet = {};
  reviewTeam.forEach(function(pr) { teamUrlSet[pr.url] = true; });
  reviewDirect = reviewDirect.filter(function(pr) { return !teamUrlSet[pr.url]; });

  function notMyPr(pr) { return getAuthor(pr).toLowerCase() !== DATA.user.toLowerCase(); }
  reviewDirect = reviewDirect.filter(notMyPr);
  reviewTeam = reviewTeam.filter(notMyPr);
  reviewChangesReq = reviewChangesReq.filter(notMyPr);
  approvedMe = approvedMe.filter(notMyPr);
  approvedTeam = approvedTeam.filter(notMyPr);

  var allReviewerPrs = [].concat(reviewDirect, reviewTeam, reviewChangesReq, approvedMe, approvedTeam);
  var botPrs = [], draftPrs = [], botUrls = {}, draftUrls = {};
  allReviewerPrs.forEach(function(pr) {
    if (isBot(pr) && !botUrls[pr.url]) { botPrs.push(pr); botUrls[pr.url] = true; }
    if (pr.isDraft && !draftUrls[pr.url] && !botUrls[pr.url]) { draftPrs.push(pr); draftUrls[pr.url] = true; }
  });
  function cleanReviewer(prs) { return prs.filter(function(pr) { return !botUrls[pr.url] && !draftUrls[pr.url]; }); }

  return {
    myApproved: myApproved, myOpen: myOpen, myDraft: myDraft, myChangesReq: myChangesReq,
    reviewDirect: cleanReviewer(reviewDirect), reviewTeam: cleanReviewer(reviewTeam),
    reviewChangesReq: cleanReviewer(reviewChangesReq),
    approvedMe: cleanReviewer(approvedMe), approvedTeam: cleanReviewer(approvedTeam),
    botPrs: botPrs, draftPrs: draftPrs

}

  var allReview = [].concat(reviewDirect, reviewTeam);
  var staleCount = allReview.filter(function(pr) { return isStale(pr); }).length;

function getTeamCounts(d) {
  var counts = {};
  DATA.teams.forEach(function(t) { counts[t] = 0; });
  var allPrs = filterByTime([].concat(d.reviewDirect, d.reviewTeam, d.reviewChangesReq, d.approvedMe, d.approvedTeam, d.botPrs, d.draftPrs, d.myApproved, d.myChangesReq, d.myOpen, d.myDraft));
  allPrs.forEach(function(pr) {
    if (pr._teams) {
      pr._teams.forEach(function(t) {
        if (counts[t] !== undefined) counts[t]++;
      });
    }
  });
  return counts;
}

function renderFilterBar(d) {
  var teamCounts = getTeamCounts(d);

  var timeOptions = [
    { val: '1w', label: '1 week' },
    { val: '3w', label: '3 weeks' },
    { val: '1m', label: '1 month' }
  ];
  var timeButtons = timeOptions.map(function(b) {
    return '<button class="' + (activeTimeFilter === b.val ? 'selected' : '') + '" onclick="setTimeFilter(\'' + b.val + '\')">' + b.label + '</button>';
  }).join('');

  var teamPills = '';
  if (DATA.teams.length > 0) {
    var sortedTeams = DATA.teams.slice()
      .filter(function(t) { return (teamCounts[t] || 0) > 0; })
      .sort(function(a, b) { return (teamCounts[b] || 0) - (teamCounts[a] || 0); });
    teamPills = sortedTeams.map(function(t) {
      var active = isTeamEnabled(t);
      var shortName = t.split('/')[1] || t;
      return '<button class="team-pill ' + (active ? 'active' : '') + '" onclick="toggleTeamFilter(\'' + escapeHtml(t) + '\')">' +
        escapeHtml(shortName) +
        '<span class="team-count">' + (teamCounts[t] || 0) + '</span>' +
      '</button>';
    }).join('');
  }

  var html = '<div class="filter-bar">' +
    '<div class="filter-group"><div class="time-nav">' + timeButtons + '</div></div>';

  if (teamPills) {
    html += '<div class="filter-separator"></div>' +
      '<div class="filter-group">' +
        '<span class="filter-group-label">Teams</span>' +
        '<div class="team-filters">' + teamPills + '</div>' +
      '</div>';
  }

  return html + '</div>';
}

// ============================================================
// Main render
// ============================================================
function render() {
  var d = processData();
  var reviewTeamFiltered = filterByTeams(d.reviewTeam);
  var approvedTeamFiltered = filterByTeams(d.approvedTeam);
  var botFiltered = filterByTeams(d.botPrs);
  var draftFiltered = filterByTeams(d.draftPrs);

  var stats = computeStats(d);

  var pendingIcon = '<svg viewBox="0 0 16 16"><path fill="var(--color-fg-muted)" d="M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2Zm.75 3.25a.75.75 0 0 0-1.5 0v2.992l-1.354.902a.75.75 0 0 0 .832 1.248l1.75-1.166a.75.75 0 0 0 .272-.576Z"></path></svg>';
  var approvedIcon = '<svg viewBox="0 0 16 16"><path fill="var(--color-success-fg)" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';
  var myPrIcon = '<svg viewBox="0 0 16 16"><path fill="var(--color-done-fg)" d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"></path></svg>';

  var app = document.getElementById('app');
  app.innerHTML =
    renderStats(stats) +
    renderFilterBar(d) +

    '<div class="columns-layout">' +
    renderSectionGroup('Pending Reviews', pendingIcon, [
      { id: 'pending-direct', label: 'Direct review requests', prs: d.reviewDirect, countClass: 'count-red', highlightStale: true },
      { id: 'pending-team', label: 'Team review requests', prs: reviewTeamFiltered, countClass: 'count-blue', highlightStale: true },
      { id: 'pending-cr', label: 'Changes requested', prs: d.reviewChangesReq, countClass: 'count-orange', highlightStale: true },
      { id: 'pending-bot', label: 'Bot (Automated) PRs', prs: botFiltered, countClass: 'count-purple', highlightStale: false },
      { id: 'pending-draft', label: 'Drafts', prs: draftFiltered, countClass: 'count-gray', highlightStale: false }
    ]) +

    renderSectionGroup('Approved Reviews', approvedIcon, [
      { id: 'approved-me', label: 'Approved by me', prs: d.approvedMe, countClass: 'count-green', highlightStale: false },
      { id: 'approved-team', label: 'Approved by team', prs: approvedTeamFiltered, countClass: 'count-green', highlightStale: false }
    ]) +

    renderSectionGroup('My Pull Requests', myPrIcon, [
      { id: 'my-approved', label: 'Approved', prs: d.myApproved, countClass: 'count-green', highlightStale: false },
      { id: 'my-cr', label: 'Changes requested', prs: d.myChangesReq, countClass: 'count-orange', highlightStale: false },
      { id: 'my-open', label: 'Open', prs: d.myOpen, countClass: 'count-blue', highlightStale: false },
      { id: 'my-drafts', label: 'Drafts', prs: d.myDraft, countClass: 'count-gray', highlightStale: false }
    ]) +
    '</div>' +

    '<div class="footer">' +
      'Generated by <a href="https://github.com/deliveroo/gh-pr-dashboard">gh pr-dashboard</a>' +
      ' &middot; ' + escapeHtml(DATA.user) + ' &middot; ' + new Date(DATA.generated).toLocaleString() +
    '</div>';

  // Populate header user
  var headerUser = document.getElementById('headerUser');
  if (headerUser) {
    headerUser.innerHTML = '<img src="https://github.com/' + escapeHtml(DATA.user) + '.png?size=40" alt="' + escapeHtml(DATA.user) + '"><span>' + escapeHtml(DATA.user) + '</span>';
  }

  // Populate header refresh
  var headerRefresh = document.getElementById('headerRefresh');
  if (headerRefresh) {
    headerRefresh.innerHTML = '<span id="last-refreshed" class="header-time-ago"></span>' +
      ' <button class="refresh-btn" data-tooltip="Auto-refreshes every ' + (DATA.autoRefreshMinutes || 15) + ' min" onclick="location.reload()"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.07-1.07A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.07 1.07A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path></svg></button>';
  }
}

// ============================================================
// Global actions
// ============================================================
function toggleSection(id) {
  CollapsedState.toggle(id);
  var el = document.querySelector('[data-section-id="' + id + '"]');
  if (el) el.classList.toggle('collapsed');
}

// ============================================================
// Initialize
// ============================================================
CollapsedState.init();
ThemeManager.init();
render();

// Live-update "Last refreshed" display
function updateRefreshedTime() {
  var el = document.getElementById('last-refreshed');
  if (el) el.textContent = timeAgo(DATA.generated) + ' ago';
}
updateRefreshedTime();
setInterval(updateRefreshedTime, 30000);

// Auto-refresh page (configurable, 0 = disabled)
var AUTO_REFRESH_MINUTES = DATA.autoRefreshMinutes || 15;
if (AUTO_REFRESH_MINUTES > 0) {
  setInterval(function() { location.reload(); }, AUTO_REFRESH_MINUTES * 60 * 1000);
}

</script>
</body>
</html>
